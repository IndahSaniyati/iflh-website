<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman Tidak Ditemukan · Indonesia Future Leaders Hub</title>
  <link rel="icon" type="image/png" href="/assets/icon_logo_web.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1c1d22] text-white flex items-center justify-center min-h-screen px-4 text-center">
  <div class="max-w-md">
    <img src="/assets/small_banner_iflh_white.png" alt="IFLH" class="h-10 mx-auto mb-6 object-contain" width="930" height="214">
    <h1 class="text-4xl font-bold text-[#f4af40] mb-2">404</h1>
    <p class="text-neutral-300 text-sm mb-6">Halaman yang Anda tuju tidak ditemukan atau telah dipindahkan.</p>
    <a href="/" class="inline-block bg-[#f4af40] text-[#1c1d22] font-semibold px-6 py-3 text-xs uppercase tracking-wider hover:bg-white transition-colors">
      Kembali ke Beranda
    </a>
  </div>
  <script>
    // If user navigated to /nslc-2026/ or /home/ directly before DNS propagates, auto redirect
    const p = window.location.pathname;
    if (p.startsWith('/home')) {
      window.location.replace('/');
    } else if (p.startsWith('/nslc-2026')) {
      window.location.replace('/nslc-2026.html' + window.location.hash);
    }
  </script>
</body>
</html>
